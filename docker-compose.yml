services:
  kafka:
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:19093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1

  deadlines-service:
    build: ./deadlines-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - KAFKA_BROKER=kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3002/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  email-service:
    build: ./email-service
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=465
      - SMTP_SECURE=true
      - SMTP_USER=${GMAIL_DUMMY}
      - SMTP_PASS=${PASS}
      - DEFAULT_FROM_EMAIL=${GMAIL_DUMMY}
      - DEFAULT_REPLY_TO=${REPLY}
      - KAFKA_BROKER=kafka:19092
      - GROUP_ID=email-group
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  association-0:
    build: ./association-service
    environment:
      - PORT=4000
      - CONTAINER_ID=0
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3999/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  association-1:
    build: ./association-service
    environment:
      - PORT=4001
      - CONTAINER_ID=1
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3999/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2
    ports:
      - "8080:8080"
      - "3999:3999"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      association-0:
        condition: service_healthy
      association-1:
        condition: service_healthy
      liaison-1:
        condition: service_healthy
      liaison-2:
        condition: service_healthy
      liaison-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  liaison-1:
    build: ./liaison-service
    environment:
      - PORT=3001
      - EMAIL_SERVICE_URL=http://email-service:3000/contact_assignee_candidate
      - SIMULATED_LATENCY=1500
      - REPLICA_ID=replica-1
      - FAILURE_MODE=${FAILURE_MODE:-none}
      - FAILURE_LATENCY_MS=${FAILURE_LATENCY_MS:-4000}
    depends_on:
      kafka:
        condition: service_healthy
      email-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  liaison-2:
    build: ./liaison-service
    environment:
      - PORT=3001
      - EMAIL_SERVICE_URL=http://email-service:3000/contact_assignee_candidate
      - SIMULATED_LATENCY=1500
      - REPLICA_ID=replica-2
      - FAILURE_MODE=${FAILURE_MODE:-none}
      - FAILURE_LATENCY_MS=${FAILURE_LATENCY_MS:-4000}
    depends_on:
      kafka:
        condition: service_healthy
      email-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  liaison-3:
    build: ./liaison-service
    environment:
      - PORT=3001
      - EMAIL_SERVICE_URL=http://email-service:3000/contact_assignee_candidate
      - SIMULATED_LATENCY=1500
      - REPLICA_ID=replica-3
      - FAILURE_MODE=${FAILURE_MODE:-none}
      - FAILURE_LATENCY_MS=${FAILURE_LATENCY_MS:-4000}
    depends_on:
      kafka:
        condition: service_healthy
      email-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
